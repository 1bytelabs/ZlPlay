<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:#0b121d;color:#edf1fa;overflow:hidden}body{padding:8px 12px;display:flex;flex-direction:column;gap:8px}button,select,input{font:inherit;color:inherit;background:linear-gradient(#192536,#111c2a);border:1px solid #304057;border-radius:10px;padding:8px;min-height:38px}button.on{background:linear-gradient(130deg,#a25bff,#7433e6);border-color:#b68aff}button:disabled,select:disabled,input:disabled{opacity:.4}header{display:flex;align-items:center;gap:12px;height:35px;flex-shrink:0}.brand{font-size:23px;color:#b48bff;display:flex;align-items:center;gap:7px}.mark{height:26px;width:28px;background:repeating-linear-gradient(90deg,#ae7cff 0 3px,transparent 3px 6px);clip-path:polygon(0 35%,20% 35%,20% 17%,40% 17%,40% 0,60% 0,60% 17%,80% 17%,80% 35%,100% 35%,100% 65%,80% 65%,80% 83%,60% 83%,60% 100%,40% 100%,40% 83%,20% 83%,20% 65%,0 65%)}#mode{font-size:14px}#connection{font-size:11px;color:#54d7c0;flex:1}#cards{display:flex;gap:8px;height:56px;overflow-x:auto;flex-shrink:0}#cards button{min-width:31%;max-width:37%;display:flex;align-items:center;text-align:left;gap:8px;overflow:hidden}#cards button:disabled{opacity:1}#cards button.active{border:2px solid #b082ff;background:#27213b}.songText{min-width:0;flex:1}.songText strong,.songText small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.songText strong{font-size:13px;font-weight:550}.songText small{font-size:11px;color:#aabdd8;margin-top:2px}.songKey{font-size:12px;color:#d9c7ff;background:#251f38;border:1px solid #51446a;border-radius:6px;padding:4px;min-width:28px;text-align:center}#viewport{overflow-x:auto;flex:0 0 25%;min-height:64px;position:relative;touch-action:pan-x}canvas{display:block;height:100%;touch-action:pan-x}#transport{display:flex;flex-direction:column;flex:1;min-height:0;gap:9px}.mainControls{display:grid;grid-template-columns:.8fr 1fr .9fr .9fr 1.5fr 1.05fr;gap:9px;flex:1;min-height:52px}.mainControls button{font-size:18px;display:flex;align-items:center;justify-content:center;gap:9px}.transportIcon{font-size:26px}#play{background:linear-gradient(130deg,#a65cff,#742de3);border-color:#ab7cff}#timer{display:flex;justify-content:center;align-items:center;gap:7px;white-space:nowrap;border-left:1px solid #304057;font-variant-numeric:tabular-nums}#elapsed{font-size:33px;font-weight:600}#total{font-size:20px;color:#aabbd6}#mixerButton{background:linear-gradient(#1bc7d5,#0fa8c4);color:#05131c}.auxControls{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;flex:1;min-height:65px}.controlGroup{display:flex;flex-direction:column;justify-content:center;padding:8px 11px;background:#111d2b;border:1px solid #304057;border-radius:12px;gap:6px}.groupTitle{font-size:10px;letter-spacing:.08em;color:#a8bddf}.controlRow{display:flex;align-items:center;gap:7px;flex:1;min-height:35px}.controlRow button,.controlRow select{height:100%;min-height:35px}#soloClick,#pad{flex:1;font-size:15px}#padNote{width:40%;font-size:16px}.bpmGroup{display:flex;height:100%;align-items:stretch;gap:0}.bpmGroup button{border-radius:0;padding:5px 9px}.bpmGroup button:first-child{border-radius:8px 0 0 8px}.bpmGroup button:last-child{border-radius:0 8px 8px 0}#bpm{width:47px;padding:4px 0;text-align:center;border-radius:0;border-left:0;border-right:0;font-size:16px}.bpmLabel{font-size:11px;color:#a8bddf}#tap{min-width:47px}#mixer{display:none;flex:1;min-height:0;gap:7px;overflow-x:auto}body.mixing #mixer{display:flex}body.mixing #viewport,body.mixing #cards,body.mixing .auxControls{display:none}body.mixing #transport{flex:0 0 55px}.strip{min-width:66px;width:66px;display:flex;flex-directi </style></head><body><header><strong class="brand"><i class="mark"></i>ZLPlay</strong><span id="mode"></span><span id="connection"></span><button id="exit"></button></header><div id="banner"></div><div id="cards"></div><div id="viewport"><canvas id="wave"></canvas></div><div id="mixer"></div><div id="transport"><div class="mainControls"><button id="rewind"><span class="transportIcon">|◀</span><span id="rewindLabel"></span></button><button id="play"><span class="transportIcon" id="playIcon">▶</span><span id="playLabel">Play</span></button><button id="stop"><span class="transportIcon">■</span>Stop</button><button id="loop"><span class="transportIcon">↻</span>Loop</button><span id="timer"><b id="elapsed">0:00</b><span id="total">/ 0:00</span></span><button id="mixerButton">☷ Mixer</button></div><div class="auxControls"><div class="controlGroup"><span class="groupTitle">CLICK</span><div class="controlRow"><button id="soloClick"></button><span class="bpmLabel">BPM</span><div class="bpmGroup"><button id="minus">−</button><input id="bpm" type="number" min="20" max="400"><button id="plus">+</button></div><button id="tap">Tap</button></div></div><div class="controlGroup"><span class="groupTitle">PAD</span><div class="controlRow"><button id="pad">▥ Pad</button><select id="padNote"></select></div></div></div></div><script src="remote-clock.js"></script><script>
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);return this;};
const lang=(navigator.language||'en').slice(0,2),tr=(pt,en,es)=>lang==='pt'?pt:lang==='es'?es:en;
const $=id=>document.getElementById(id),notes=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];let state=null,online=false,zoom=2,struct='',swiping=false,taps=[];const strips=new Map(),clock=new RemoteClock();
$('mode').textContent=tr('Controle remoto','Remote control','Control remoto');$('exit').textContent=tr('Reprodutor','Player','Reproductor');$('soloClick').textContent=tr('Click solo','Solo Click','Click solo');$('rewindLabel').textContent=tr('Início','Start','Inicio');$('padNote').title=tr('Tom do pad','Pad key','Tono del pad');$('exit').onclick=()=>ZLRemote.exit();
for(let n=0;n<12;n++){for(const id of ['padNote']){const option=document.createElement('option');option.value=n;option.textContent=notes[n];$(id).append(option);}}
function send(type,value,track){if(!online||!state)return;ZLRemote.send(JSON.stringify({type,value,track}));}
for(const id of ['loop','soloClick','pad'])$(id).onclick=()=>send(id,!state[id]);$('play').onclick=()=>send(state?.playing?'pause':'play');$('stop').onclick=()=>send('stop');$('rewind').onclick=()=>{if(state&&!state.playing)send('seek',0);};$('padNote').onchange=e=>send('padNote',+e.target.value);$('minus').onclick=()=>send('bpm',Math.max(20,(state?.bpm||120)-1));$('plus').onclick=()=>send('bpm',Math.min(400,(state?.bpm||120)+1));$('bpm').onchange=e=>send('bpm',Math.max(20,Math.min(400,+e.target.value)));$('tap').onclick=()=>{const now=Date.now();if(taps.length&&now-taps[taps.length-1]>2000)taps=[];taps.push(now);if(taps.length>6)taps.shift();if(taps.length>1)send('bpm',Math.round(60000*(taps.length-1)/(now-taps[0])));};$('mixerButton').onclick=()=>document.body.classList.toggle('mixing');
const time=v=>`${Math.floor(v/60)}:${String(Math.floor(v%60)).padStart(2,'0')}`;
function rebuild(){strips.clear();$('cards').replaceChildren();const songs=state.songs.length?state.songs:[{id:-1,name:state.title,active:true}];for(const song of songs){const card=document.createElement('button');const words=document.createElement('span');words.className='songText';const title=document.createElement('strong'),artist=document.createElement('small');title.textContent=song.title||song.name;artist.textContent=song.artist||'';words.append(title,artist);card.append(words);if(song.key){const badge=document.createElement('span');badge.className='songKey';badge.textContent=song.key;card.append(badge);}card.className=song.active?'active':'';card.onclick=()=>send('song',song.id);card.disabled=!online||song.id<0||state.playing;$('cards').append(card);}const click=state.tracks.find(t=>t.role===2),guide=state.tracks.find(t=>t.role===1);let list=[{id:-1,name:'Master',gain:state.master},{id:state.clickSource==='project'&&click?click.id:-2,name:'Click',gain:state.clickVolume},...(guide?[guide]:[{id:-3,name:tr('Guia','Guide','Guía'),gain:1}]),{id:-4,name:'Pad',gain:state.padVolume},{id:-5,name:'BUS VS',gain:state.vs,mute:state.vsMute,solo:state.vsSolo},...state.tracks.filter(t=>!t.role)];$('mixer').replaceChildren();for(const channel of list){const strip=document.createElement('div');strip.className='strip';const name=document.createElement('label');name.textContent=channel.name;strip.append(name);const db=document.createElement('small');strip.append(db);const rail=document.createElement('div');rail.className='rail';const thumb=document.createElement('div');thumb.className='thumb';rail.append(thumb);strip.append(rail);let active=false,lastTap=0;const adjust=e=>{const box=rail.getBoundingClientRect(),v=Math.max(0,Math.min(2,2*(1-(e.clientY-box.top-8)/(box.height-16))));thumb.style.top=(8+(box.height-16)*(1-v/2))+'px';db.textContent=v?((20*Math.log10(v)).toFixed(1)+' dB'):'−∞';send('gain',v,channel.id);};thumb.onpointerdown=e=>{if(!online)return;active=true;thumb.setPointerCapture(e.pointerId);e.stopPropagation();e.preventDefault();};thumb.onpointermove=e=>{if(active)adjust(e);};thumb.onpointerup=e=>{if(!active)return;active=false;if(Date.now()-lastTap<300)send('gain',1,channel.id);lastTap=Date.now();e.preventDefault();};thumb.onpointercancel=()=>active=false;let mute,solo;if(channel.id>=0||channel.id===-5){const ms=document.createElement('div');ms.className='ms';mute=document.createElement('button');mute.textContent='M';mute.onclick=()=>send('mute',!strips.get(channel.id).value.mute,channel.id);solo=document.createElement('button');solo.textContent='S';solo.onclick=()=>send('solo',!strips.get(channel.id).value.solo,channel.id);ms.append(mute,solo);strip.append(ms);}strips.set(channel.id,{rail,thumb,db,mute,solo,value:channel,active:()=>active});$('mixer').append(strip);}}
window.acceptState=function(value){if(value.protocol!==1)return;state=value;clock.update(state,performance.now());online=true;$('banner').style.display='none';$('connection').textContent=tr('Conectado · áudio no computador','Connected · audio on computer','Conectado · audio en ordenador');const key=JSON.stringify([value.projectId,value.tracks.map(t=>[t.id,t.name,t.group,t.role]),value.songs,value.clickSource]);if(key!==struct){struct=key;rebuild();}for(const element of document.querySelectorAll('#transport button,#transport select,#transport input,.ms button'))element.disabled=false;for(const id of ['loop','soloClick','pad'])$(id).classList.toggle('on',!!state[id]);$('playIcon').textContent=state.playing?'Ⅱ':'▶';$('playLabel').textContent=state.playing?'Pause':'Play';$('total').textContent='/ '+time(state.duration);if(document.activeElement!==$('bpm'))$('bpm').value=Math.round(state.bpm);$('padNote').value=state.padNote;$('rewind').disabled=state.playing;for(const button of $('cards').children)button.disabled=state.playing||!state.songs.length;for(const [id,strip]of strips){let value=id>=0?state.tracks.find(t=>t.id===id):{gain:id===-1?state.master:id===-2?state.clickVolume:id===-4?state.padVolume:id===-5?state.vs:1,mute:state.vsMute,solo:state.vsSolo};if(!value)continue;strip.value=value;if(!strip.active()){const h=strip.rail.clientHeight;strip.thumb.style.top=(8+(h-16)*(1-Math.min(2,value.gain)/2))+'px';strip.db.textContent=value.gain?(20*Math.log10(value.gain)).toFixed(1)+' dB':'−∞';}strip.mute?.classList.toggle('on',!!value.mute);strip.solo?.classList.toggle('on',!!value.solo);}draw();};
window.remoteDisconnected=function(){clock.freeze(performance.now());online=false;$('connection').textContent='';$('banner').style.display='block';$('banner').textContent=tr('Desconectado. A reprodução continua no computador. Volte ao Reprodutor para parear novamente.','Disconnected. Playback continues on the computer. Return to Player to pair again.','Desconectado. La reproducción sigue en el ordenador. Vuelve a Reproductor para emparejar.');for(const element of document.querySelectorAll('#transport button,#transport select,#transport input,#cards button,.ms button'))element.disabled=true;$('mixerButton').disabled=false;};
function draw(){if(!state)return;const position=clock.value(performance.now());$('elapsed').textContent=time(position);if(document.body.classList.contains('mixing'))return;const viewport=$('viewport'),canvas=$('wave'),w=Math.max(1,viewport.clientWidth*zoom),h=Math.max(1,viewport.clientHeight),d=state.duration||1;canvas.style.width=w+'px';canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.clearRect(0,0,w,h);const regions=state.regions.length?state.regions:[{name:'',start:0,end:d,color:'#357fb0'}];regions.forEach((r,index)=>{const x=r.start/d*w,right=r.end/d*w,color=/^#[a-f0-9]{6}$/i.test(r.color)?r.color:'#357fb0',current=state.playing&&position>=r.start&&position<r.end,loop=state.loop&&Math.abs(state.loopStart-r.start)<.1,pending=index===state.pending;c.fillStyle=color+'35';c.beginPath();c.roundRect(x+1,20,Math.max(1,right-x-2),h-23,7);c.fill();c.save();c.clip();c.strokeStyle=color;c.beginPath();for(let i=Math.floor(r.start/d*512);i<Math.min(512,Math.ceil(r.end/d*512));i++){const px=i/512*w,amp=((state.peaks||[])[i]||0)*(h-55)*.4;c.moveTo(px,h*.55-amp);c.lineTo(px,h*.55+amp);}c.stroke();c.restore();c.lineWidth=current||loop||pending?2:1;c.strokeStyle=pending?'#c394ff':loop?'#e8bd59':current?'#35d4e8':color;c.beginPath();c.roundRect(x+1,20,Math.max(1,right-x-2),h-23,7);c.stroke();c.save();c.beginPath();c.rect(x+6,20,Math.max(1,right-x-12),h);c.clip();c.fillStyle='#e9edf8';c.font='12px sans-serif';c.fillText(r.name,x+8,37);if(pending||loop)c.fillText(pending?tr('SALTO','NEXT','SALTO'):'LOOP',x+8,h-10);c.restore();});const beat=60/(state.bpm||120)*4/(state.denominator||4),bar=state.numerator||4;let stride=1;while(beat/d*w*stride<12)stride*=2;for(let b=0;b*beat<d;b+=stride){const x=b*beat/d*w;c.strokeStyle=b%bar===0?'#bdd6ed55':'#bdd6ed22';c.beginPath();c.moveTo(x,42);c.lineTo(x,h);c.stroke();if(b%bar===0){c.fillStyle='#a6b9d5';c.font='10px sans-serif';c.fillText(b/bar+1,x+2,12);}}const cursor=position/d*w;c.strokeStyle='white';c.lineWidth=2;c.beginPath();c.moveTo(cursor,17);c.lineTo(cursor,h);c.stroke();if(state.playing&&!swiping&&(cursor<viewport.scrollLeft||cursor>viewport.scrollLeft+viewport.clientWidth*.9))viewport.scrollTo({left:Math.max(0,cursor-viewport.clientWidth*.15),behavior:'smooth'});}
let downX=0,cursorDrag=false,moved=false;const wave=$('wave');wave.onpointerdown=e=>{downX=e.clientX;moved=false;swiping=true;};wave.onpointermove=e=>{if(Math.abs(e.clientX-downX)>8)moved=true;};wave.onpointerup=e=>{swiping=false;if(!state||moved)return;const box=wave.getBoundingClientRect(),at=(e.clientX-box.left)/box.width*state.duration,index=state.regions.findIndex(r=>at>=r.start&&at<r.end);if(index>=0)send('region',index);};wave.onpointercancel=()=>{swiping=false;};document.addEventListener('wheel',e=>{if(e.ctrlKey){zoom=Math.max(1,Math.min(16,zoom*(e.deltaY<0?1.2:.8)));draw();e.preventDefault();}},{passive:false});let pinchDistance=0,pinchZoom=zoom;
wave.addEventListener('touchstart',e=>{if(e.touches.length===2){pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchZoom=zoom;cursorDrag=false;moved=true;e.preventDefault();}},{passive:false});
wave.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchDistance){const distance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom=Math.max(1,Math.min(16,pinchZoom*distance/pinchDistance));cursorDrag=false;moved=true;draw();e.preventDefault();}},{passive:false});
wave.addEventListener('touchend',()=>{pinchDistance=0;});
for(const control of document.querySelectorAll('#transport button,#transport select,#transport input'))control.disabled=true;
function animate(){if(state&&online&&state.playing)draw();requestAnimationFrame(animate);}requestAnimationFrame(animate);window.addEventListener('resize',draw);$('connection').textContent=tr('Sincronizando…','Synchronizing…','Sincronizando…');
